name: "Deploy Beardy's Battle Chess to GitHub Pages"

on:
  push:
    branches:
      - main
      # temporary: deploy from the feature branch until the PR merges
      - claude/beardys-battle-chess-8ma2xd
    paths:
      - "beardys-battle-chess/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: beardys-battle-chess

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
