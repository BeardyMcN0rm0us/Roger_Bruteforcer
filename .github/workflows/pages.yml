name: "Deploy Beardy's Battle Chess to GitHub Pages"

on:
  push:
    branches:
      - main
      # temporary: deploy from the feature branch until the PR merges
      - claude/beardys-battle-chess-8ma2xd
    paths:
      - "beardys-battle-chess/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Publish the game folder as the gh-pages branch. Creating that branch
      # auto-enables GitHub Pages (classic branch mode) — no admin API needed.
      - name: Publish to gh-pages branch
        run: |
          cd beardys-battle-chess
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Beardy's Battle Chess (${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
